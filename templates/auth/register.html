{% extends 'base.html' %}
{% block content %}
  <div class="form-card">
    <h2>Create your SafeLink AI account</h2>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <p class="muted-text" style="margin-bottom: 12px;">Create your account and enable email-based two-step verification during sign-in.</p>
      <div class="form-group">
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" required />
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required />
      </div>
      <button class="btn btn-primary" type="submit">Register</button>
    </form>
    <p class="muted-text" style="margin-top: 12px;">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </p>
  </div>
{% endblock %}
